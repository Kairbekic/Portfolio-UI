stages:
  - test
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

ui-tests:
  stage: test
  image: docker:24.0.7
  services:
    - docker:24.0.7-dind
  variables:
    LOGIN: $LOGIN
    PASSWORD: $PASSWORD
  before_script:
    - apk add --no-cache git
    # Клонируем ветку страниц GitLab. Если падает — создаем пустую папку
    - git clone --branch gl-pages https://oauth2:${CI_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git gl-pages || mkdir gl-pages
    - mkdir -p allure-results/history
    - cp -R gl-pages/history/* allure-results/history/ || true
  script:
    # 1. Если контейнер ломается на pytest, принудительно накатим зависимости через docker-compose run перед стартом
    - docker-compose run regression pip install -r requirements.txt || true

    # 2. Запускаем тесты через твой docker-compose
    - docker-compose up --exit-code-from regression || true

    # 3. ГЕНЕРАЦИЯ ОТЧЕТА: вместо docker-compose (где нет allure),
    # используем готовый легкий официальный образ allure, смонтировав текущую папку ($PWD)
    - docker run --rm -v "$PWD:$PWD" -w "$PWD" frankescobar/allure-docker-service allure generate allure-results --clean -o allure-report || true

    # 4. Обновляем историю для следующих запусков
    - mkdir -p gl-pages/history
    - cp -R allure-report/history/* gl-pages/history/ || true
  artifacts:
    when: always
    paths:
      - allure-report/
      - gl-pages/
    expire_in: 1 day
  when: manual

pages:
  stage: deploy
  image: alpine:latest
  script:
    - mkdir -p public
    - if [ -d "allure-report" ]; then cp -R allure-report/* public/; else echo "allure-report not found!"; exit 1; fi
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH