name: UI Tests

on: [push]

jobs:
  ui-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 1. ВОЗВРАЩЕН ВАЖНЫЙ ШАГ: Подтягиваем ветку gh-pages для сохранения трендов (истории)
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: ./.github/gh-pages
        continue-on-error: true

      - name: Run UI-tests via docker-compose
        env:
          LOGIN: ${{ secrets.LOGIN }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          docker compose up --build --exit-code-from regression || true

      - name: Copy history from gh-pages to allure-results
        run: |
          sudo mkdir -p allure-results/history
          # 2. ИСПРАВЛЕНО: добавлено || true. Если истории еще нет, шаг не сломает сборку
          sudo cp -R ./.github/gh-pages/history/* allure-results/history/ || true

      - name: Generate Allure report
        run: |
          sudo chmod -R 777 allure-results
          sudo npm install -g allure-commandline --save-dev
          allure generate allure-results --clean -o allure-report
          

      - name: Update Allure history
        run: |
          sudo mkdir -p ./.github/gh-pages/history
          # 3. ИСПРАВЛЕНО: добавлено || true
          sudo cp -R allure-report/history/* ./.github/gh-pages/history/ || true

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@4.1.5
        with:
          token: ${{ secrets.CI_TOKEN }}
          branch: gh-pages
          folder: allure-report
          clean: true